# SPIKE ONLY (#144) — DO NOT MERGE TO main.
#
# Question: can the six x64 Apple test tasks, which currently report SKIPPED on
# GitHub's arm64 macos-latest while the job stays green, be made to actually
# EXECUTE under Rosetta 2?
#
# The failure mode this workflow is built against is a silent skip that is
# indistinguishable from success. So nothing here trusts an exit code or
# "BUILD SUCCESSFUL": every claim is an executed test count read out of the
# result XML, cross-checked against an arch marker printed from inside the test
# binary itself.
name: Spike — Rosetta x64 on arm64 macOS (#144)

on:
  push:
    branches: [spike/144-rosetta-x64]
  workflow_dispatch:

jobs:
  spike:
    name: x64 Apple tests under Rosetta
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Runner facts
        run: |
          set -x
          uname -a
          uname -m
          sw_vers
          sysctl -n machdep.cpu.brand_string
          xcodebuild -version
          echo "java os.arch:"
          java -XshowSettings:properties -version 2>&1 | grep -E "os\.arch|os\.name"

      # Question 1: is Rosetta 2 present and usable?
      # `arch -x86_64` alone is weak evidence (it can fall back). The C probe
      # reports `uname -m` AND sysctl.proc_translated from inside the process,
      # so an x86_64 build that prints machine=x86_64 proc_translated=1 is
      # positive proof that Rosetta translated a real x86_64 image.
      - name: Probe Rosetta 2 (before any install)
        id: probe
        continue-on-error: true
        run: |
          set -x
          pgrep -l oahd || echo "NO oahd (Rosetta daemon) RUNNING"
          ls -la /Library/Apple/usr/libexec/oah 2>&1 || echo "NO /Library/Apple/usr/libexec/oah"
          clang -arch arm64  -o /tmp/probe_arm64 .github/spike/proc_translated.c
          clang -arch x86_64 -o /tmp/probe_x64   .github/spike/proc_translated.c
          file /tmp/probe_arm64 /tmp/probe_x64
          echo "--- arm64 probe ---"
          /tmp/probe_arm64
          # Deliberately NOT guarded with `|| echo`: this step's outcome IS the
          # answer to "is Rosetta usable", and the install step below keys off
          # it. Swallowing the failure would make the probe unable to report no.
          echo "--- x86_64 probe (needs Rosetta) ---"
          /tmp/probe_x64

      - name: Install Rosetta 2 if the probe failed
        if: steps.probe.outcome == 'failure'
        continue-on-error: true
        run: |
          set -x
          sudo softwareupdate --install-rosetta --agree-to-license
          /tmp/probe_x64 && echo "ROSETTA_AFTER_INSTALL=yes" || echo "ROSETTA_AFTER_INSTALL=no"

      # Resolve a concrete simulator UDID per family. KGP normally supplies a
      # device convention, but only for a task it considers enabled — so once we
      # force-enable an x64 simulator task we have to supply one ourselves.
      # UDIDs rather than device NAMES on purpose: names drift with the image
      # ("Apple TV 4K (3rd generation)"), and a guessed name fails identically
      # to a simulator that cannot run x86_64 — which is the answer we are here
      # to measure and must not confuse with a typo.
      - name: Simulator inventory + resolve device UDIDs
        id: sims
        continue-on-error: true
        run: |
          set -u
          xcrun simctl list runtimes
          for fam in iOS tvOS watchOS; do
            udid=$(xcrun simctl list devices available -j \
                     | python3 .github/spike/pick_sim_udid.py "$fam")
            key=$(echo "$fam" | tr "[:upper:]" "[:lower:]")
            echo "SPIKE_UDID_$key=$udid"
            echo "${key}=${udid}" >> "$GITHUB_OUTPUT"
          done

      # Baseline in the SAME run: an arm64 task that is known to execute today.
      # Its SPIKE_ARCH marker must read ARM64 — that is what makes the x64
      # marker meaningful rather than a string nobody checked the negative of.
      - name: Baseline — macosArm64Test (expected to execute, arch ARM64)
        continue-on-error: true
        run: ./gradlew :lsp:macosArm64Test --init-script .github/spike/rosetta.init.gradle

      # Each task in its OWN invocation: with a single `--continue` run, one
      # task failing to launch can still change what later tasks do. Separate
      # invocations make each target's outcome independent and individually
      # attributable. Exit codes are recorded for the report but decide nothing.
      - name: Run the x64 Apple test tasks with the host-arch check overridden
        continue-on-error: true
        run: |
          # `set +e`: GitHub runs `run:` under `bash -e`, so without this the
          # FIRST target that fails ends the loop and the remaining targets go
          # unmeasured — reported as neither pass nor fail, which is the exact
          # ambiguity this spike exists to remove.
          set +e -u
          for t in \
            ":lsp:macosX64Test" \
            ":lsp-ksrpc:macosX64Test" \
            ":lsp:iosX64Test" \
            ":lsp-ksrpc:iosX64Test" \
            ":lsp:tvosX64Test" \
            ":lsp:watchosX64Test" ; do
            echo "::group::gradle $t"
            ./gradlew "$t" --init-script .github/spike/rosetta.init.gradle \
              -Pspike.device.ios="${{ steps.sims.outputs.ios }}" \
              -Pspike.device.tvos="${{ steps.sims.outputs.tvos }}" \
              -Pspike.device.watchos="${{ steps.sims.outputs.watchos }}"
            echo "SPIKE_TASK_EXIT $t = $?"
            echo "::endgroup::"
          done

      # Independent of anything Gradle says: what architecture are the test
      # binaries the tasks were pointed at? A THIN x86_64 Mach-O cannot execute
      # natively on an arm64 host at all, so if such a binary produced test
      # results, Rosetta is the only path it could have taken.
      - name: Architecture of the produced test binaries
        if: always()
        continue-on-error: true
        run: |
          set -u
          shopt -s nullglob
          for f in */build/bin/*/debugTest/*.kexe; do
            echo "== $f"
            file "$f"
            lipo -archs "$f" || true
          done

      - name: ASSERT executed counts per target
        if: always()
        run: |
          python3 .github/spike/assert_executed.py \
            lsp/build/test-results/macosArm64Test \
            lsp/build/test-results/macosX64Test \
            lsp-ksrpc/build/test-results/macosX64Test \
            lsp/build/test-results/iosX64Test \
            lsp-ksrpc/build/test-results/iosX64Test \
            lsp/build/test-results/tvosX64Test \
            lsp/build/test-results/watchosX64Test

      - name: Dump every result XML found (raw evidence)
        if: always()
        continue-on-error: true
        run: |
          set -u
          shopt -s nullglob
          for f in */build/test-results/*/*.xml; do
            echo "===== $f"
            cat "$f"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-144-results
          path: |
            **/build/test-results/
            **/build/reports/tests/
