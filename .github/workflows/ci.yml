name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly real-server matrix runs on a schedule (and on demand), NOT on
  # push/pull_request — so it never gates PRs. Off-peak, deliberately on a
  # non-:00 minute to dodge the top-of-hour scheduling congestion on GitHub.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  build:
    name: JVM / JS / Wasm / Linux (ubuntu)
    runs-on: ubuntu-latest
    # Backstop against an unbounded hang (e.g. the #79 teardown wedge): GitHub's
    # default job timeout is 6h, so a wedged test would silently burn runner
    # minutes until then. This job runs in ~13min; 30 is >2x headroom, so it
    # never trips a healthy run but converts any future hang into a fast, visible
    # failure instead of a 6h bleed.
    timeout-minutes: 30
    # Fast, hermetic per-PR leg. Skip on the nightly `schedule` trigger — the
    # `nightly` job below covers that with the real-server matrix turned on.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # `apt-get install` against a stale package index 404s when the indexed
      # version has been superseded on the mirror. `nightly` and publish.yaml's
      # `verify` already refresh first; this job did not.
      #
      # Deliberately NO `continue-on-error`. clangd sits behind BOTH gates, and
      # the two behave differently in this job:
      #   RealServerIntegrationTest:50   requireOrSkip           -> HARD-FAILS
      #     here, because this job sets `-Plsp.requireIntegrationTests=true`.
      #   LspProcessSpawnRealServerTest:77  requireRealServerOrSkip -> skips
      #     silently here, because this job does NOT set `requireRealServers`.
      # So a missing clangd both reddens the Test step AND silently thins the
      # real-server coverage. Swallowing this step's failure would surface the
      # first as a confusing test error 13 minutes later, and hide the second
      # entirely -- the uninterpretable green tracked in #132.
      #
      # Retries cover the transient mirror errors that `update` newly exposes:
      # the step runs under `bash -e`, so a failed refresh now aborts here.
      - name: Install clangd (for real-server integration tests)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y clangd

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Codegen reproducibility
        run: |
          ./gradlew :lsp-codegen:generate
          ./gradlew :lsp:ktlintFormat :lsp-ksrpc:ktlintFormat
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is out of date. Regenerate with ':lsp-codegen:generate', then ':lsp:ktlintFormat :lsp-ksrpc:ktlintFormat', and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      # Binary-compatibility validation (JVM `.api` + klib `*.klib.api`). The
      # klib ABI covers every native/JS/wasm target; Apple targets (and any
      # other target unsupported on a Linux host) are INFERRED by BCV from the
      # targets ubuntu can build, so the committed `*.klib.api` baseline is
      # host-independent and `apiCheck` is deterministic here. We deliberately
      # run apiCheck on the ubuntu leg (not the macOS `appleCheck` leg) because
      # that leg only compiles the Apple targets in isolation and lacks the
      # full merge inputs the klib dump needs.
      - name: API compatibility (JVM + klib ABI)
        run: ./gradlew apiCheck

      - name: Test
        run: ./gradlew allTests -Plsp.requireIntegrationTests=true

      # Kover instruments :lsp and aggregates JVM execution from
      # :lsp-ksrpc:jvmTest (already run by the step above, so this is fast).
      # `koverVerify` fails the build if line/branch coverage drops below the
      # floor in `lsp/kover-baseline.txt`; the HTML/summary artifacts are
      # uploaded below for reviewer drill-down.
      - name: Kover (coverage + baseline gate)
        run: ./gradlew koverVerify koverHtmlReport koverXmlReport koverSummary koverPublishLspHtml koverPublishLspXml -Plsp.requireIntegrationTests=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ubuntu
          path: "**/build/reports/tests/"

      # Always upload (success or failure): the HTML report lets reviewers
      # see exactly which generated types/serializers aren't hit, and the
      # summary.md is the artifact actually read in the PR review.
      - name: Upload Kover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-report-ubuntu
          path: lsp/build/reports/kover/

  apple:
    name: Apple targets (macOS)
    runs-on: macos-latest
    # Healthy run ~10min; 30 is generous headroom (macOS runners vary) while
    # still bounding any hang. See the build job for the rationale.
    timeout-minutes: 30
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The macOS leg only covers what ubuntu can't: the Apple klibs. `appleCheck`
      # (defined in the library convention plugin) compiles every Apple target and
      # runs the simulator/host tests, skipping the redundant JVM/JS/Wasm/ktlint/
      # codegen work the ubuntu leg already does.
      # The Apple leg runs LspProcessRealServerTest (real clangd over a posix
      # stdio pipe) via macos*Test -> nativeJsonrpcTest, but it installed no
      # clangd and armed no gate — and the native skip path is a bare early
      # return that reports as an ordinary PASS, not a <skipped/>. So a green
      # apple job could not distinguish "drove real clangd" from "did nothing"
      # on macosArm64, a published coordinate (#132). (Only macosArm64 — the
      # macosX64 test task reports SKIPPED on this runner and has never run at
      # all, which is a different gap, tracked separately in #144.)
      #
      # MEASURED, not assumed: clangd IS on the macos-latest default PATH today.
      # A probe run of this job with the install removed and the gate armed went
      # green, with the test executing and no skip marker — so the test has been
      # driving a real clangd all along, by accident of the runner image.
      #
      # That is the SECOND of the two possibilities #132 said it could not
      # distinguish between, and it is the one that still needs fixing: an
      # incidental dependency on an unpinned image tool, which would start
      # silently no-op'ing the day the image drops it. So install clangd
      # explicitly (own the dependency rather than inherit it) and prove it is
      # on PATH in its own step, before anything depends on it — a missing
      # binary then fails here, with an obvious cause, instead of surfacing as
      # an opaque failure inside a six-minute Gradle run.
      - name: Install clangd (for the native real-server test)
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Show clangd (proves it is on PATH before the gate is armed)
        run: clangd --version

      - name: Build + test Apple targets
        run: ./gradlew :lsp:appleCheck :lsp-ksrpc:appleCheck -Plsp.requireRealServers=true

      # Executed evidence for the test this job exists to make interpretable.
      # Arming the gate turns a MISSING clangd into a hard failure, but it
      # cannot tell you the test ran at all — if the class ever stops being
      # wired into macos*Test there is nothing for the gate to fire on and the
      # leg is green-and-vacuous again. So assert the result XML positively.
      #
      # Two independent checks, because neither alone is sufficient:
      #   * the XML must exist and report tests > 0 — catches "not wired in";
      #   * its captured output must NOT carry the LSP_SKIP marker — catches
      #     the skip path, which is otherwise INVISIBLE here.
      #
      # On that second check: counting XML proves a test EXECUTED, never that
      # it ASSERTED anything. Any test whose body can skip itself defeats the
      # count, on any platform — Kotlin/Native just forces the situation, since
      # it has no `Assume` and a skip must be hand-rolled as an early return.
      # The two cases are not literally byte-identical (the ran case's
      # <system-out> carries clangd's own stderr) but every NUMBER in the file
      # is the same, which is what makes the instrument blind. The marker the
      # guard prints is the only field that differs on purpose. Do not swap
      # this for a duration check: K/N reports ~0.0s for every native suite,
      # including ones observed driving a child process.
      #
      # `sed -n '/<testsuite/{…;q;}'` rather than `sed … | head -1`: under
      # GitHub's default `bash -eo pipefail`, head exiting early SIGPIPEs sed,
      # pipefail makes the pipeline 141, and -e then kills the step with NO
      # message — silently, and only once some file grows a second <testsuite>.
      # Quitting inside sed has no pipe to break. (Same hazard as #152.)
      - name: Verify the real-server native test actually executed
        if: success() || failure()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          found=0
          for f in lsp-ksrpc/build/test-results/macosArm64Test/*LspProcessRealServerTest.xml; do
            found=$((found + 1))
            tests=$(sed -n '/<testsuite/{s/.*tests="\([0-9]*\)".*/\1/p;q;}' "$f")
            tests=${tests:-0}
            echo "  $f: tests=$tests"
            if [ "$tests" -eq 0 ]; then
              echo "::error::LspProcessRealServerTest reported 0 executions."
              exit 1
            fi
            if grep -q "LSP_SKIP" "$f"; then
              echo "::error::LspProcessRealServerTest SKIPPED (LSP_SKIP marker present) — it passed without driving clangd."
              grep "LSP_SKIP" "$f"
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No LspProcessRealServerTest result XML under lsp-ksrpc/build/test-results/macosArm64Test — the real-server test did NOT run on this leg."
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos
          path: "**/build/reports/tests/"

  # mingwX64 is a PUBLISHED coordinate (`com.monkopedia.lsp:lsp-mingwx64` and
  # `:lsp-ksrpc-mingwx64` are live on Central) and `mingwX64Test` EXISTS as a
  # Gradle task — but CI only had ubuntu and macos runners, so that task had
  # never executed anywhere (#129). Everything read as covered: `allTests`
  # passed on ubuntu, `appleCheck` on macOS, and `apiCheck` does gate mingw's
  # ABI — so a Windows-only regression in the native path could ship to Central
  # with nothing to catch it. This job points the instrument at it.
  #
  # Per-PR rather than nightly, chosen deliberately: the repo is public, so
  # windows-latest minutes are free, and the job runs in ~7min IN PARALLEL with
  # the ~13min ubuntu leg — it does not extend PR wall-clock.
  windows:
    name: Windows / mingwX64
    runs-on: windows-latest
    # ~7min healthy; 30 bounds any hang. See the build job for the rationale.
    timeout-minutes: 30
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run mingwX64 tests
        run: ./gradlew :lsp:mingwX64Test :lsp-ksrpc:mingwX64Test

      # Executed-count evidence, and it ENFORCES rather than reports.
      #
      # `BUILD SUCCESSFUL` is printed identically by a run of N tests and a run
      # of zero, and a target whose tests silently stop running is exactly the
      # failure this job exists to prevent — so the count is the only real
      # signal. An earlier draft of this step only PRINTED "nothing executed"
      # and left the job green: a guard that is green in precisely the failure
      # it exists to catch. It now exits non-zero. That failure path was
      # verified by counterfactual (a probe that suppressed the result XMLs
      # turned this step red) rather than assumed from reading it.
      #
      # The total is DERIVED from the XML, never hardcoded: a hardcoded floor is
      # wrong the day the suite changes and then gets edited to match by whoever
      # hits it, which is how a floor becomes a rubber stamp. Parsing avoids
      # `grep` under `set -e` (a grep matching nothing exits 1 and reddens the
      # job with a misleading message); `sed -n …p` yields empty instead.
      - name: Verify tests actually executed
        if: success() || failure()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s globstar nullglob
          total=0; files=0
          for f in **/build/test-results/**/*.xml; do
            files=$((files + 1))
            n=$(sed -n 's/.*<testsuite[^>]*tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
            n=${n:-0}
            total=$((total + n))
            echo "  $f: $n"
          done
          echo "files=$files total_tests=$total"
          if [ "$files" -eq 0 ]; then
            echo "::error::No test-results XML produced — mingwX64Test executed NOTHING."
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "::error::$files result files but 0 test executions — the suite reported without running."
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: "**/build/reports/tests/"

  nightly:
    name: Nightly real-server matrix (ubuntu)
    runs-on: ubuntu-latest
    # Healthy run ~10min (incl. external-server installs); 30 bounds any hang
    # without tripping a slow-but-healthy install. See the build job rationale.
    timeout-minutes: 30
    # Only the scheduled run and manual dispatch — never on push/pull_request,
    # so this never gates a PR. It installs the external language servers that
    # `RealServerClientRoleTest` drives, then runs `allTests` with BOTH gates on:
    #   -Plsp.requireIntegrationTests=true  -> hermetic wire-compat tests hard-fail on skip
    #   -Plsp.requireRealServers=true       -> real-server client-role tests hard-fail on skip
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    # Pinned tool versions. Bumping any of these is a deliberate, reviewable change.
    env:
      CLANGD_PKG: "clangd-18"
      PYRIGHT_VERSION: "1.1.391"
      RUFF_VERSION: "0.8.4"
      TS_LS_VERSION: "4.3.3"
      TYPESCRIPT_VERSION: "5.7.2"
      GOPLS_VERSION: "v0.16.2"
      RUST_ANALYZER_VERSION: "2024-12-16"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # --- External language servers ---------------------------------------
      # Each install is best-effort: `continue-on-error` keeps one broken
      # ecosystem from killing the whole nightly run. A server that fails to
      # install simply isn't on PATH, and with `requireRealServers=true` its
      # test will hard-fail loudly in the test step (visible, not silent) —
      # which is exactly the signal we want from the nightly.

      - name: Install clangd (C/C++)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y "$CLANGD_PKG"
          # RealServerClientRoleTest invokes the bare `clangd` binary.
          sudo ln -sf "/usr/bin/${CLANGD_PKG}" /usr/local/bin/clangd
          clangd --version

      - name: Setup Node (for npm-based servers)
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pyright (Python)
        continue-on-error: true
        run: |
          npm install -g "pyright@${PYRIGHT_VERSION}"
          pyright-langserver --version || true

      - name: Install typescript-language-server (TypeScript)
        continue-on-error: true
        run: |
          npm install -g "typescript@${TYPESCRIPT_VERSION}" "typescript-language-server@${TS_LS_VERSION}"
          typescript-language-server --version || true

      - name: Setup Go (for gopls)
        continue-on-error: true
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install gopls (Go)
        continue-on-error: true
        run: |
          go install "golang.org/x/tools/gopls@${GOPLS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup Rust + rust-analyzer
        continue-on-error: true
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rust-analyzer || true
          # rustup ships a `rust-analyzer` proxy; expose it on PATH explicitly.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(rustup which rust-analyzer)" "$HOME/.local/bin/rust-analyzer" || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ruff (Python, pinned)
        continue-on-error: true
        run: |
          python3 -m pip install --user "ruff==${RUFF_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ruff --version || true

      - name: Report installed servers
        run: |
          echo "PATH=$PATH"
          for bin in clangd pyright-langserver typescript-language-server gopls rust-analyzer ruff; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "FOUND: $bin -> $(command -v "$bin")"
            else
              echo "MISSING: $bin"
            fi
          done

      - name: Build
        run: ./gradlew build

      # `lsp.captureCorpus=true` makes RealServerClientRoleTest tee every observed
      # LSP wire frame to `lsp-ksrpc/src/jvmTest/resources/captured/<server>/...`,
      # so each nightly run refreshes the real-payload corpus that
      # CapturedCorpusReplayTest decodes/round-trips. Capture is opt-in and is
      # NEVER set on the per-PR / local path.
      - name: Test (hermetic + real servers, capture corpus)
        run: ./gradlew allTests -Plsp.requireIntegrationTests=true -Plsp.requireRealServers=true -Plsp.captureCorpus=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-nightly
          path: "**/build/reports/tests/"
